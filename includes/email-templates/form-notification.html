<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;padding:0;background:#f4f1f0;">
  <!-- Everything is tables and inline styles on purpose: Outlook has no flex or
       grid, Gmail strips <style> blocks, and several clients drop external CSS
       entirely. This has to survive all of them, so it is built the boring way. -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f1f0;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background:#ffffff;border:1px solid #e4dedc;border-radius:14px;overflow:hidden;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

          <tr>
            <td style="background:#1C1311;padding:20px 26px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font:700 17px/1.2 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#ffffff;letter-spacing:.02em;">
                    PRIMO<span style="color:#e00000;">TV</span>
                  </td>
                  <td align="right" style="font:700 11px/1.2 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#FFD36A;letter-spacing:.16em;text-transform:uppercase;">
                    {{kicker}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:26px 26px 6px;">
              <div style="font:700 21px/1.3 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1C1311;">{{title}}</div>
              <div style="height:3px;width:44px;background:#e00000;border-radius:2px;margin:12px 0 0;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:18px 26px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;color:#1C1311;">
                {{rows}}
              </table>
            </td>
          </tr>

          {{message}}

          <tr>
            <td style="padding:22px 26px 26px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #ece6e4;">
                <tr><td style="padding-top:14px;font:400 12px/1.7 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#8a7d7a;">{{meta}}</td></tr>
              </table>
            </td>
          </tr>

        </table>
        <div style="font:400 11px/1.6 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#9b908d;padding:14px 8px 0;">
          Sent automatically by primotv.ca — reply to this email to answer the sender directly.
        </div>
      </td>
    </tr>
  </table>
</body>
</html>
